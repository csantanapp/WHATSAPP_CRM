<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Minhas Tarefas · CRM WhatsApp Tractom</title>
<link rel="stylesheet" href="/css/base.css" />
</head>
<body class="ds">
  <div class="ds-shell">
    <aside class="ds-sidebar">
      <div class="ds-sidebar-logo"><div class="mark">T</div> CRM WhatsApp</div>
      <nav class="ds-nav">
        <a class="ds-nav-item" href="/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 0 1-12.36 7.58L4 20l1.08-4.44A8.5 8.5 0 1 1 21 11.5Z"/></svg> Atendimento</a>
        <a class="ds-nav-item active" href="/tasks/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Minhas tarefas</a>
        <a class="ds-nav-item" id="ds-users-link" href="/users/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg> Usuários</a>
      </nav>
      <div class="ds-sidebar-spacer"></div>
    </aside>

    <div class="ds-main">
      <header class="ds-header">
        <div class="ds-user">
          <div class="ds-user-avatar" id="ds-user-avatar">–</div>
          <span id="ds-user-name">Carregando...</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="ds-logout-btn">Sair</button>
      </header>

      <main class="ds-content">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6);">
          <div>
            <h1 class="ds-h1">Minhas tarefas</h1>
            <p class="ds-muted" style="margin-top:4px;">Follow-ups pendentes atribuídos a você</p>
          </div>
          <button class="btn btn-primary" id="new-task-btn">+ Nova tarefa</button>
        </div>

        <div id="overdue-banner" class="badge badge-danger" style="display:none;margin-bottom:var(--space-4);padding:8px 14px;font-size:var(--font-size-sm);"></div>

        <div class="card">
          <table class="table" id="tasks-table">
            <thead>
              <tr>
                <th>Tarefa</th>
                <th>Contato</th>
                <th>Prazo</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tasks-tbody">
              <tr><td colspan="4"><div class="skeleton" style="height:16px;width:100%;"></div></td></tr>
            </tbody>
          </table>
          <div id="tasks-empty" class="empty-state" style="display:none;">
            <div class="empty-state-title">Nenhuma tarefa pendente 🎉</div>
            <p class="ds-muted">Quando você criar um follow-up, ele aparece aqui.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="new-task-modal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Nova tarefa</h2>
        <button class="btn btn-ghost btn-sm" id="close-new-task">✕</button>
      </div>
      <form id="new-task-form">
        <div class="modal-body">
          <div class="field">
            <label class="label" for="nt-title">Título</label>
            <input class="input" id="nt-title" required placeholder="Ex: Retornar sobre proposta" />
          </div>
          <div class="field">
            <label class="label" for="nt-description">Descrição (opcional)</label>
            <textarea class="input" id="nt-description" rows="3"></textarea>
          </div>
          <div class="field">
            <label class="label" for="nt-due">Prazo</label>
            <input class="input" id="nt-due" type="datetime-local" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-new-task">Cancelar</button>
          <button type="submit" class="btn btn-primary">Criar tarefa</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script src="/js/auth-guard.js"></script>
  <script>
    function toast(message, kind) {
      var el = document.createElement('div');
      el.className = 'toast' + (kind ? ' ' + kind : '');
      el.textContent = message;
      document.getElementById('toast-stack').appendChild(el);
      setTimeout(function () { el.remove(); }, 3500);
    }

    async function api(path, opts) {
      opts = opts || {};
      var res = await fetch('/api' + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
      if (res.status === 401) {
        window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname);
        throw new Error('not_authenticated');
      }
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        var msg = (data.error && typeof data.error === 'object') ? data.error.message : (data.error || 'Erro na requisição');
        throw new Error(msg);
      }
      return data;
    }

    function formatDue(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function isOverdue(iso) {
      return iso && new Date(iso).getTime() < Date.now();
    }

    async function loadTasks() {
      var tbody = document.getElementById('tasks-tbody');
      var tasks = await api('/tasks/mine');
      tbody.innerHTML = '';
      document.getElementById('tasks-empty').style.display = tasks.length ? 'none' : 'flex';

      var overdueCount = tasks.filter(function (t) { return isOverdue(t.due_at); }).length;
      var banner = document.getElementById('overdue-banner');
      if (overdueCount > 0) {
        banner.style.display = 'inline-block';
        banner.textContent = overdueCount + ' tarefa(s) atrasada(s)';
      } else {
        banner.style.display = 'none';
      }

      tasks.forEach(function (t) {
        var tr = document.createElement('tr');
        var overdue = isOverdue(t.due_at);
        tr.innerHTML =
          '<td>' + (t.description ? '<div>' + escapeHtml(t.title) + '</div><div class="ds-subtle">' + escapeHtml(t.description) + '</div>' : escapeHtml(t.title)) + '</td>' +
          '<td>' + escapeHtml(t.contact_name || '—') + (t.phone_display ? '<div class="ds-subtle">' + escapeHtml(t.phone_display) + '</div>' : '') + '</td>' +
          '<td style="color:' + (overdue ? 'var(--color-danger)' : 'inherit') + ';font-weight:' + (overdue ? '600' : '400') + ';">' + formatDue(t.due_at) + '</td>' +
          '<td style="text-align:right;"><button class="btn btn-secondary btn-sm complete-btn" data-id="' + t.id + '">Concluir</button></td>';
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll('.complete-btn').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          try {
            await api('/tasks/' + btn.getAttribute('data-id') + '/complete', { method: 'POST' });
            toast('Tarefa concluída.', 'success');
            loadTasks();
          } catch (err) {
            toast(err.message, 'danger');
          }
        });
      });
    }

    function escapeHtml(s) {
      var div = document.createElement('div');
      div.textContent = s == null ? '' : s;
      return div.innerHTML;
    }

    var modal = document.getElementById('new-task-modal');
    document.getElementById('new-task-btn').addEventListener('click', function () { modal.style.display = 'flex'; });
    document.getElementById('close-new-task').addEventListener('click', function () { modal.style.display = 'none'; });
    document.getElementById('cancel-new-task').addEventListener('click', function () { modal.style.display = 'none'; });

    document.getElementById('new-task-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      try {
        await api('/tasks', {
          method: 'POST',
          body: JSON.stringify({
            title: document.getElementById('nt-title').value,
            description: document.getElementById('nt-description').value || null,
            due_at: document.getElementById('nt-due').value ? new Date(document.getElementById('nt-due').value).toISOString() : null,
          }),
        });
        modal.style.display = 'none';
        document.getElementById('new-task-form').reset();
        toast('Tarefa criada.', 'success');
        loadTasks();
      } catch (err) {
        toast(err.message, 'danger');
      }
    });

    loadTasks().catch(function (err) {
      if (err.message !== 'not_authenticated') toast('Erro ao carregar: ' + err.message, 'danger');
    });
  </script>
</body>
</html>
