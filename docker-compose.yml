services:
  whatsapp-crm-app:
    build: .
    container_name: whatsapp-crm-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/whatsapp_crm
      - WHISPER_LOCAL_URL=http://whisper:9000
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      whisper:
        condition: service_started
    volumes:
      - whatsapp_crm_media:/data/media
    networks:
      - whatsapp-crm
      - caddy_net

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whatsapp-crm-whisper
    restart: unless-stopped
    environment:
      - ASR_MODEL=small
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL_PATH=/data/whisper
    volumes:
      - whatsapp_crm_whisper_models:/data/whisper
    expose:
      - "9000"
    networks:
      - whatsapp-crm

  db:
    image: postgres:16-alpine
    container_name: whatsapp-crm-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=whatsapp_crm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - whatsapp_crm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - whatsapp-crm

networks:
  whatsapp-crm:
  caddy_net:
    external: true
    name: deskcommcrm_internal

volumes:
  whatsapp_crm_db_data:
  whatsapp_crm_media:
  whatsapp_crm_whisper_models:
